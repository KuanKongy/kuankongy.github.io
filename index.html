<!doctype html>
<html lang="en" class="dark" data-scene="night">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG favicons at the max useful sizes (512 = PWA/install ceiling,
         32 = tab). Safari rasterizes SVG favicons poorly (the white-border
         culprit) and tends to pick the LAST declared icon — keep 512 last.
         Generated from favicon-v7.svg — swap the design with
         `python3 scripts/make-favicons.py v3` (any favicon-vN.svg works;
         the script rewrites the PNGs and this comment). -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon-512.png" />
    <!-- Safari start page / bookmarks / tab-hover icon — full-bleed square,
         Safari applies its own rounding. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a0a3d" />
    <title>Nam Le — Software Developer</title>
    <meta
      name="description"
      content="Nam Le is a UBC Computer Science student building full-stack systems, cloud infrastructure, and games. Portfolio rendered inside a playable Tricky Towers 3D night-sky world."
    />
    <link rel="canonical" href="https://kuankongy.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nam Le — Software Developer" />
    <meta
      property="og:description"
      content="Full-stack developer and UBC CS student. Portfolio rendered inside a playable Tricky Towers 3D night-sky world."
    />
    <meta property="og:url" content="https://kuankongy.github.io/" />
    <meta property="og:image" content="https://kuankongy.github.io/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nam Le — Software Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer and UBC CS student. Portfolio rendered inside a playable Tricky Towers 3D night-sky world."
    />
    <meta name="twitter:image" content="https://kuankongy.github.io/og.png" />
    <style>
      html.dark { background-color: #06030f; }
      html:not(.dark) { background-color: #dbe7fb; }
      html:not(.dark)[data-scene="evening"] { background-color: #f3d9b8; }
    </style>
    <script>
      // Resolve the theme before first paint. Priority: ?theme= param >
      // saved toggle > OS preference (first visit). Must mirror stored.dark
      // and stored.sceneTime in src/store/gameStore.ts.
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("trickyTowers.dark");
          var dark = forced
            ? forced !== "light"
            : saved === null
              ? !matchMedia("(prefers-color-scheme: light)").matches
              : saved === "1";
          document.documentElement.classList.toggle("dark", dark);
          var st = localStorage.getItem("trickyTowers.sceneTime");
          var scene = dark ? "night" : st === "EVENING" ? "evening" : "day";
          document.documentElement.setAttribute("data-scene", scene);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              "content",
              dark ? "#1a0a3d" : scene === "evening" ? "#f0c393" : "#c8d8f8",
            );
        } catch (e) {
          /* stay on the static dark default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
